<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fyoutube</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell" aria-label="Fyoutube actions">
      <ul class="release-highlights" aria-label="Highest-priority changes">
        <li>Built-in YouTube ad blocking. uBlock Origin is no longer required (3.0.0).</li>
        <li>Search cards show title, then channel, then description (3.0.0).</li>
        <li>Queued playlist videos stay on the watch page (3.0.0).</li>
      </ul>
      <button id="open-youtube" class="action action-primary" type="button">
        Go to YouTube
      </button>
      <button id="check-updates" class="action action-secondary" type="button">
        Check for updates
      </button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
